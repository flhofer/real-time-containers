name: C/C++ CI

on:
  push:
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - 'Makefile'
      - '**/Makefile'
      - 'test/resources/**'
      - 'tools/Dockerfile-Build-*'
      - '.github/workflows/cicd.yml'
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - 'Makefile'
      - '**/Makefile'
      - 'test/resources/**'
      - 'tools/Dockerfile-Build-*'
      - '.github/workflows/cicd.yml'
  schedule:
    - cron: "0 2 * * 0" # Run at 2am UTC on Sun

permissions:
  contents: read

jobs:
  build_and_test:
    name: "Compile artifacts"

    runs-on: ubuntu-22.04
          
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
            sudo apt-get update \
            && sudo apt-get install -y gcc make git check libsubunit-dev libjson-c-dev libnuma-dev libcap-dev libgsl-dev libgsl-dbg

    - name: "Build Orchestrator"
      run: make orchestrator
      env:
        DEBUG: ${{ !endsWith(github.ref, '/master') }}

    - name: "Build Use cases"
      run: make usecases
      env:
        DEBUG: ${{ !endsWith(github.ref, '/master') }}

    - name: Build test code - libcheck
      run: make test

    - name: Move binaries to new folder
      run: |
        mkdir bin \
        && mv orchestrator check_test DataGenerator WorkerApp bin/

    - name: Upload result for job
      uses: actions/upload-artifact@v4.3.3
      with:
        name: binaries
        path: bin/

  test_containers:
    name: "Test ${{ matrix.name }}"

    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            id: ubuntu-2204
            dockerfile: Dockerfile-Build-ubuntu-22.04
          - name: Ubuntu 24.04
            id: ubuntu-2404
            dockerfile: Dockerfile-Build-ubuntu-24.04
          - name: Ubuntu latest
            id: ubuntu-latest
            dockerfile: Dockerfile-Build-ubuntu
          - name: Debian latest
            id: debian-latest
            dockerfile: Dockerfile-Build-debian
          - name: Fedora latest
            id: fedora-latest
            dockerfile: Dockerfile-Build-fedora
          - name: Alpine latest
            id: alpine-latest
            dockerfile: Dockerfile-Build-alpine

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build container
      timeout-minutes: 10
      run: docker build --progress=plain -t "ci-${{ matrix.id }}" -f "tools/${{ matrix.dockerfile }}" tools/

    - name: Run tests
      timeout-minutes: 10
      run: docker run --rm -v "$PWD":/home "ci-${{ matrix.id }}"
